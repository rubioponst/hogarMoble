<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Formulario de Contacto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  </head>
  <body>

    <div class="container mt-5">
      <h2>Formulario de Contacto</h2>
      <form id="contactoForm">
        <!-- Campo Nombre -->
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="nombre" placeholder="Introduce tu nombre" required>
        </div>

        <!-- Campo Apellidos -->
        <div class="mb-3">
          <label for="apellidos" class="form-label">Apellidos</label>
          <input type="text" class="form-control" id="apellidos" placeholder="Introduce tus apellidos" required>
        </div>

        <!-- Campo Teléfono -->
        <div class="mb-3">
          <label for="telefono" class="form-label">Teléfono</label>
          <input type="tel" class="form-control" id="telefono" placeholder="Introduce tu teléfono" required>
        </div>

        <!-- Campo Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Correo Electrónico</label>
          <input type="email" class="form-control" id="email" placeholder="Introduce tu correo electrónico" required>
        </div>

        <!-- Motivo de contacto -->
        <div class="mb-3">
          <label for="motivo" class="form-label">Motivo de Contacto</label>
          <select class="form-select" id="motivo" required>
            <option value="" disabled selected>Selecciona un motivo</option>
            <option value="consulta">Colecciones</option>
            <option value="soporte">Productos</option>
            <option value="sugerencia">Sugerencias</option>
            <option value="otros">Otros</option>
          </select>
        </div>

        <!-- Botón Enviar -->
        <button type="button" class="btnNav">Enviar</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
